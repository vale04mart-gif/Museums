<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Museums</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins', sans-serif;color:white;}

/* FONDO */
@keyframes fondo{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* HOME */
#home{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background: linear-gradient(270deg,#00f0ff,#0072ff,#001f4d);
  background-size:600% 600%;
  animation:fondo 8s infinite;
}

h1{
  font-family:'Bebas Neue';
  font-size:90px;
  text-shadow:0 0 20px #00f0ff;
}

.tagline{
  font-size:24px;
  margin:20px;
}

.buttons{
  display:flex;
  gap:20px;
}

button{
  padding:15px 30px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px white;
}

.ripley{background:#ff7b00;}
.cera{background:#00bfff;}
.back{margin:30px;}

/* SECCIONES */
.section{
  display:none;
  padding:50px;
  min-height:100vh;
  background-size:600% 600%;
  animation:fondo 10s infinite;
}

#ripley{
  background: linear-gradient(270deg,#ff7b00,#ff3c00,#1a0000);
}
#cera{
  background: linear-gradient(270deg,#00bfff,#0044ff,#000033);
}

h2{
  text-align:center;
  font-family:'Bebas Neue';
  font-size:65px;
  margin-bottom:40px;
}

/* TARJETAS */
.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:40px 0;
  padding:20px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  border-radius:20px;
}

.item:nth-child(even){
  flex-direction:row-reverse;
}

.item img{
  width:170px;
  height:170px;
  border-radius:15px;
  cursor:pointer;
}

.text{
  width:60%;
  font-size:20px;
}

/* VISOR */
#visor{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#visor img{
  max-width:80%;
  max-height:70%;
}

/* INFO */
#infoBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#00bfff;
  padding:18px;
  border-radius:50%;
  cursor:pointer;
}

#infoModal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background: linear-gradient(135deg,#00c6ff,#0072ff,#001f4d);
  padding:30px;
  border-radius:20px;
  text-align:center;
}
</style>
</head>

<body>

<!-- MUSICA -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- HOME -->
<section id="home">
  <h1>Museums</h1>
  <p class="tagline">Explore, discover, and live unforgettable experiences.</p>

  <div class="buttons">
    <button class="ripley" onclick="showSection('ripley')">Ripley</button>
    <button class="cera" onclick="showSection('cera')">Wax Museum</button>
  </div>
</section>

<!-- RIPLEY -->
<section id="ripley" class="section">
  <h2>Ripley's Experience</h2>
  <div id="ripleyList"></div>
  <button class="back" onclick="backHome()">Back</button>
</section>

<!-- CERA -->
<section id="cera" class="section">
  <h2>Wax Museum</h2>
  <div id="ceraList"></div>
  <button class="back" onclick="backHome()">Back</button>
</section>

<!-- VISOR -->
<div id="visor">
  <img id="visorImg">
  <button onclick="closeVisor()">Close</button>
</div>

<!-- INFO -->
<div id="infoBtn" onclick="openInfo()">
  <i class="fas fa-info"></i>
</div>

<div id="infoModal">
  <div class="modal-content">
    <h3>Museum Info</h3>
    <p><b>Prices:</b> $80 - $150 MXN</p>
    <p><b>Location:</b> Mexico City</p>
    <p><b>Schedule:</b> 10:00 AM - 7:00 PM</p>

    <iframe 
      src="https://www.google.com/maps?q=Museo%20Ripley%20CDMX&output=embed"
      width="100%" height="200"
      style="border-radius:10px;">
    </iframe>

    <button onclick="closeInfo()">Close</button>
  </div>
</div>

<script>

function showSection(id){
  home.style.display="none";
  ripley.style.display="none";
  cera.style.display="none";
  document.getElementById(id).style.display="block";
}

function backHome(){
  home.style.display="flex";
  ripley.style.display="none";
  cera.style.display="none";
}

/* 👇 YA CORREGIDO A "Imagen" */
function createList(start,end,id){
  const container=document.getElementById(id);

  const texts=[
    "A unique and unforgettable museum experience.",
    "Discover something new and exciting.",
    "Perfect for photos and memories.",
    "Explore creativity and imagination.",
    "A place you must visit.",
    "An incredible journey awaits you."
  ];

  for(let i=start;i<=end;i++){
    let div=document.createElement("div");
    div.className="item";

    div.innerHTML=`
      <img src="Imgs/Imagen${i}.jpeg" onclick="openImage('Imgs/Imagen${i}.jpeg')">
      <div class="text">${texts[i%texts.length]}</div>
    `;

    container.appendChild(div);
  }
}

function openImage(src){
  visor.style.display="flex";
  visorImg.src=src;
}

function closeVisor(){
  visor.style.display="none";
}

function openInfo(){
  infoModal.style.display="flex";
}

function closeInfo(){
  infoModal.style.display="none";
}

/* RANGOS */
createList(24,38,"ripleyList");
createList(1,22,"ceraList");

</script>

</body>
</html>
